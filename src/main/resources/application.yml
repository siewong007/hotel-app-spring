server:
  port: ${BACKEND_PORT:3030}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotelapp}
    username: ${SPRING_DATASOURCE_USERNAME:hotelapp}
    password: ${SPRING_DATASOURCE_PASSWORD:hotelapp}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt-secret: ${APP_JWT_SECRET:}
  environment: ${APP_ENVIRONMENT:local}
  desktop-mode: ${APP_DESKTOP_MODE:false}
  allowed-origins-raw: ${APP_ALLOWED_ORIGINS_RAW:}
  trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
