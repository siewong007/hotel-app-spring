server:
  port: ${BACKEND_PORT:3030}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: ${JWT_ISSUER:hotel-app-be}
  jwt-audience: ${JWT_AUDIENCE:hotel-web}
  environment: ${APP_ENV:${ENVIRONMENT:development}}
  desktop-mode: ${HOTEL_DESKTOP_MODE:false}
  allowed-origins-raw: ${ALLOWED_ORIGINS:*}
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  smtp-from-name: ${SMTP_FROM_NAME:Salim Inn}
  paypal-enabled: ${PAYPAL_ENABLED:false}
  paypal-client-id: ${PAYPAL_CLIENT_ID:}
  paypal-client-secret: ${PAYPAL_CLIENT_SECRET:}
  paypal-api-base: ${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}
  paypal-webhook-id: ${PAYPAL_WEBHOOK_ID:}
  hotel-bank-name: ${HOTEL_BANK_NAME:Maybank}
  hotel-bank-account-name: ${HOTEL_BANK_ACCOUNT_NAME:Salim Inn}
  hotel-bank-account-number: ${HOTEL_BANK_ACCOUNT_NUMBER:511270052595}
  turnstile-enabled: ${TURNSTILE_ENABLED:false}
  turnstile-site-key: ${TURNSTILE_SITE_KEY:}
  turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
  turnstile-verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  passkey-rp-id: ${PASSKEY_RP_ID:localhost}
  totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
  skip-email-verification: ${SKIP_EMAIL_VERIFICATION:false}
