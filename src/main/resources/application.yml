server:
  port: ${BACKEND_PORT:3030}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt-secret: ${JWT_SECRET:}
  environment: ${ENVIRONMENT:${APP_ENV:development}}
  desktop-mode: ${HOTEL_DESKTOP_MODE:false}
  allowed-origins-raw: ${ALLOWED_ORIGINS:*}
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
